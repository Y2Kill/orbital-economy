name: Bench full

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: true
        default: main
        type: string
permissions:
  contents: read

concurrency:
  group: bench-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-full:
    name: bench-full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.11.1'
      - name: Install bench dependencies offline from vendor
        working-directory: lab
        shell: bash
        run: |
          set -euo pipefail
          cache="${RUNNER_TEMP}/orbital-economy-npm-cache"
          rm -rf "${cache}"
          mkdir -p "${cache}"
          npm cache add ./vendor/simulation-9.0.0.tgz ./vendor/csv-parse-5.6.0.tgz --cache "${cache}"
          npm ci --offline --cache "${cache}"
          rm -rf "${cache}"
      - name: Run all 27 Modes
        working-directory: lab
        run: node --expose-gc src/cli.js lab --input=input
      - name: Run accepted-vs-itself policy gate
        working-directory: lab
        run: node --expose-gc src/cli.js policy --modes=all
      - name: Upload bench reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-full-${{ github.run_id }}
          path: lab/output/
          if-no-files-found: error
          retention-days: 14
